[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bronchoscope-trajectory-reconstruction"
version = "0.1.0"
description = "Reconstruct a bronchoscope tip trajectory from M0/M1/M2 motor sequences."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Zhang Quan" }]
dependencies = []

[project.scripts]
broncho-trajectory = "broncho_trajectory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
